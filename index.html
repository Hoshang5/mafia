<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لعبة المافيا</title>
  
  <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
    }

    html, body {
        height: 100%;
        width: 100%;
        background-color: #0b0f19;
        color: #f8fafc;
        overflow: hidden;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
    }

    /* شاشة الدخول */
    .login-overlay {
        position: fixed;
        inset: 0;
        background-color: #0b0f19;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-box {
        background-color: #151d2a;
        padding: 24px;
        border-radius: 12px;
        border: 1px solid #243044;
        width: 100%;
        max-width: 320px;
        text-align: center;
    }

    .login-box h2 {
        color: #ef4444;
        margin-bottom: 8px;
        font-size: 1.4rem;
    }

    .login-box p {
        color: #64748b;
        font-size: 0.8rem;
        margin-bottom: 16px;
    }

    .login-box input {
        width: 100%;
        background-color: #0b0f19;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px;
        color: white;
        font-size: 0.9rem;
        outline: none;
        margin-bottom: 12px;
        text-align: center;
    }

    .login-box button {
        width: 100%;
        background-color: #dc2626;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 0.9rem;
        cursor: pointer;
    }

    /* الشريط العلوي */
    header {
        background-color: #151d2a;
        padding: 10px 14px;
        border-bottom: 1px solid #243044;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .room-info h1 {
        color: #ef4444;
        font-size: 1rem;
        font-weight: 800;
    }

    .room-info p {
        color: #64748b;
        font-size: 0.7rem;
    }

    .role-badge {
        background-color: #1e293b;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #334155;
        font-size: 0.75rem;
        color: #94a3b8;
    }

    .role-badge span {
        color: #facc15;
        font-weight: bold;
    }

    .status-badge {
        text-align: left;
    }

    .phase-tag {
        background-color: #312e81;
        color: #a5b4fc;
        font-size: 0.65rem;
        padding: 2px 6px;
        border-radius: 10px;
        display: block;
        margin-bottom: 2px;
    }

    .timer {
        font-size: 0.95rem;
        font-weight: bold;
        color: #ef4444;
        font-family: monospace;
    }

    /* شريط اللاعبين */
    .players-bar {
        background-color: #0f172a;
        padding: 8px 12px;
        border-bottom: 1px solid #1e293b;
        overflow-x: auto;
        white-space: nowrap;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
    }

    .players-bar::-webkit-scrollbar {
        display: none;
    }

    .player-card {
        background-color: #1e293b;
        padding: 6px 10px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        font-size: 0.8rem;
        border: 1px solid #334155;
    }

    .player-card.dead {
        opacity: 0.4;
        text-decoration: line-through;
        background-color: #111827;
        border-color: #1f2937;
    }

    .action-btn-sm {
        background-color: #dc2626;
        color: white;
        border: none;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        cursor: pointer;
    }

    .action-btn-sm.doctor {
        background-color: #0284c7;
    }

    .action-btn-sm.detective {
        background-color: #eab308;
        color: #000;
        font-weight: bold;
    }

    .start-btn-sm {
        background-color: #16a34a;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 0.75rem;
        font-weight: bold;
        flex-shrink: 0;
        cursor: pointer;
    }

    .reset-btn-sm {
        background-color: #475569;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.75rem;
        flex-shrink: 0;
        cursor: pointer;
    }

    /* منطقة الشات */
    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        background-color: #0b0f19;
    }

    .chat-box {
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .system-msg {
        text-align: center;
        margin: 4px 0;
    }

    .system-msg span {
        background-color: #151d2a;
        color: #e2e8f0;
        font-size: 0.75rem;
        padding: 5px 12px;
        border-radius: 12px;
        border: 1px solid #334155;
        display: inline-block;
    }

    .message {
        background-color: #1e293b;
        padding: 8px 12px;
        border-radius: 10px;
        max-width: 80%;
        width: fit-content;
        align-self: flex-start;
    }

    .message.my-message {
        background-color: #312e81;
        border: 1px solid #4338ca;
        align-self: flex-end;
    }

    .sender-other {
        font-size: 0.7rem;
        font-weight: bold;
        color: #818cf8;
        margin-bottom: 2px;
        display: block;
    }

    .sender-me {
        font-size: 0.7rem;
        font-weight: bold;
        color: #facc15;
        margin-bottom: 2px;
        display: block;
    }

    .message p {
        font-size: 0.85rem;
        line-height: 1.3;
    }

    .chat-input-area {
        padding: 8px;
        background-color: #151d2a;
        border-top: 1px solid #243044;
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }

    .chat-input-area input {
        flex: 1;
        background-color: #0b0f19;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 8px 12px;
        color: white;
        font-size: 0.85rem;
        outline: none;
    }

    .chat-input-area input:disabled {
        background-color: #1e293b;
        cursor: not-allowed;
    }

    .send-btn {
        background-color: #4f46e5;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 0.85rem;
        cursor: pointer;
    }

    .send-btn:disabled {
        background-color: #334155;
        cursor: not-allowed;
    }
  </style>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2>لعبة المافيا</h2>
      <p>أدخل اسمك للانضمام إلى الغرفة (4-12 لاعب)</p>
      <input type="text" id="usernameInput" placeholder="اسمك باللعبة..." maxlength="15">
      <button id="joinBtn">انضمام للغرفة</button>
    </div>
  </div>

  <div class="app-container">
    <header>
      <div class="room-info">
        <h1>المافيا</h1>
        <p>غرفة #1234</p>
      </div>

      <div class="role-badge">
        دورك: <span id="myRoleDisplay">في الانتظار</span>
      </div>

      <div class="status-badge">
        <span class="phase-tag" id="phaseDisplay">الانتظار</span>
        <div class="timer" id="timerDisplay">00:00</div>
      </div>
    </header>

    <div class="players-bar" id="playersBar">
      <button class="start-btn-sm" id="startGameBtn">بدء اللعبة (4-12)</button>
      <button class="reset-btn-sm" id="resetGameBtn">إعادة ضبط</button>
    </div>

    <main>
      <div class="chat-box" id="chatBox">
        <div class="system-msg">
          <span>مرحباً بك في غرفة لعبة المافيا!</span>
        </div>
      </div>

      <form class="chat-input-area" id="chatForm">
        <input type="text" id="chatInput" placeholder="اكتب رسالتك..." autocomplete="off" required>
        <button type="submit" class="send-btn" id="sendBtn">إرسال</button>
      </form>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCFcV4jWLfEv1NFSlU-Rd2xfGEJTfRfT3Y",
      authDomain: "mafia-8290b.firebaseapp.com",
      projectId: "mafia-8290b",
      storageBucket: "mafia-8290b.firebasestorage.app",
      messagingSenderId: "310781490795",
      appId: "1:310781490795:web:bbc0d87841c3f57f23e32e",
      databaseURL: "https://mafia-8290b-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const roomRef = database.ref('rooms/1234');

    const loginOverlay = document.getElementById('loginOverlay');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinBtn');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatBox = document.getElementById('chatBox');
    const playersBar = document.getElementById('playersBar');
    const startGameBtn = document.getElementById('startGameBtn');
    const resetGameBtn = document.getElementById('resetGameBtn');
    const phaseDisplay = document.getElementById('phaseDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const myRoleDisplay = document.getElementById('myRoleDisplay');

    let currentUsername = "";
    let myPlayerKey = "";
    let myRole = "في الانتظار";
    let isAlive = true;
    let currentPhase = "waiting";

    // الانضمام مع فحص الحد الأقصى (12 لاعب)
    joinBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (name !== "") {
        roomRef.child('players').once('value', (snapshot) => {
          const players = snapshot.val();
          if (players && Object.keys(players).length >= 12) {
            alert("الغرفة ممتلئة بالكامل! الحد الأقصى هو 12 لاعباً.");
            return;
          }

          currentUsername = name;
          const newPlayerRef = roomRef.child('players').push();
          myPlayerKey = newPlayerRef.key;

          newPlayerRef.set({
            name: currentUsername,
            role: "مواطن",
            isAlive: true,
            votes: 0
          });

          newPlayerRef.onDisconnect().remove();
          loginOverlay.style.display = 'none';
        });
      }
    });

    // إرسال الرسائل
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (text !== "" && currentUsername !== "" && isAlive) {
        if (currentPhase === "night" && myRole !== "مافيا") return;

        roomRef.child('messages').push({
          sender: currentUsername,
          text: text,
          timestamp: Date.now()
        });
        chatInput.value = "";
      }
    });

    // عرض الرسائل
    roomRef.child('messages').on('child_added', (snapshot) => {
      const data = snapshot.val();
      const msgDiv = document.createElement('div');
      
      if (data.isSystem) {
        msgDiv.className = 'system-msg';
        msgDiv.innerHTML = `<span>${data.text}</span>`;
      } else {
        const isMe = data.sender === currentUsername;
        msgDiv.classList.add('message');
        if (isMe) {
          msgDiv.classList.add('my-message');
          msgDiv.innerHTML = `<span class="sender-me">${data.sender}</span><p>${data.text}</p>`;
        } else {
          msgDiv.innerHTML = `<span class="sender-other">${data.sender}</span><p>${data.text}</p>`;
        }
      }

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // بدء اللعبة (شرط من 4 إلى 12 لاعب)
    startGameBtn.addEventListener('click', () => {
      roomRef.child('players').once('value', (snapshot) => {
        const players = snapshot.val();
        if (!players) return;

        const playerKeys = Object.keys(players);
        const count = playerKeys.length;

        if (count < 4) {
          alert(`يحتاج 4 لاعبين على الأقل لبدء اللعبة! العدد الحالي: ${count}`);
          return;
        }

        if (count > 12) {
          alert("الحد الأقصى للعبة هو 12 لاعباً!");
          return;
        }

        const shuffledKeys = playerKeys.sort(() => Math.random() - 0.5);

        // توزيع الأدوار تلقائياً حسَب عدد اللاعبين:
        // 4-7 لاعبين: 1 مافيا، 1 محقق، 1 طبيب، والباقي مواطنين
        // 8-12 لاعب: 2 مافيا، 1 محقق، 1 طبيب، والباقي مواطنين
        shuffledKeys.forEach((key, index) => {
          let assignedRole = "مواطن";
          if (index === 0) assignedRole = "مافيا";
          else if (index === 1 && count >= 8) assignedRole = "مافيا"; // مافيا ثاني للغرف الكبيرة
          else if (index === (count >= 8 ? 2 : 1)) assignedRole = "محقق";
          else if (index === (count >= 8 ? 3 : 2)) assignedRole = "طبيب";

          roomRef.child(`players/${key}`).update({
            role: assignedRole,
            isAlive: true,
            votes: 0
          });
        });

        roomRef.child('messages').remove();
        roomRef.child('nightActions').remove();

        startPhase("night", 30, "🌙 بدأ الليل! المافيا تختار الضحية، الطبيب يحمي، والمحقق يفحص...");
      });
    });

    // إعادة الضبط
    resetGameBtn.addEventListener('click', () => {
      roomRef.update({
        status: "waiting",
        timer: 0
      });
      roomRef.child('nightActions').remove();
      roomRef.child('messages').push({
        text: "تم إعادة ضبط الغرفة.",
        isSystem: true
      });
    });

    // إدارة المراحل
    function startPhase(phaseName, duration, sysMessage) {
      roomRef.update({
        status: phaseName,
        timer: duration
      });

      roomRef.child('messages').push({
        text: sysMessage,
        isSystem: true
      });

      roomRef.child('players').once('value', (snapshot) => {
        const players = snapshot.val();
        if (players) {
          Object.keys(players).forEach(key => {
            roomRef.child(`players/${key}/votes`).set(0);
          });
        }
      });
    }

    // الاستماع لحالة الغرفة
    roomRef.on('value', (snapshot) => {
      const roomData = snapshot.val();
      if (!roomData) return;

      currentPhase = roomData.status || "waiting";
      const timer = roomData.timer || 0;

      if (currentPhase === "waiting") {
        phaseDisplay.textContent = "الانتظار";
        enableChat(true);
      } else if (currentPhase === "night") {
        phaseDisplay.textContent = "الليل 🌙";
        enableChat(myRole === "مافيا" && isAlive);
      } else if (currentPhase === "day") {
        phaseDisplay.textContent = "النهار ☀️";
        enableChat(isAlive);
      } else if (currentPhase === "voting") {
        phaseDisplay.textContent = "التصويت 🗳️";
        enableChat(isAlive);
      }

      timerDisplay.textContent = timer < 10 ? `00:0${timer}` : `00:${timer}`;
    });

    function enableChat(enable) {
      chatInput.disabled = !enable;
      sendBtn.disabled = !enable;
      chatInput.placeholder = enable ? "اكتب رسالتك..." : "الشات مغلق حالياً...";
    }

    // متابعة اللاعبين والأزرار
    roomRef.child('players').on('value', (snapshot) => {
      const players = snapshot.val();
      
      if (players && myPlayerKey && players[myPlayerKey]) {
        myRole = players[myPlayerKey].role;
        isAlive = players[myPlayerKey].isAlive;
        myRoleDisplay.textContent = myRole;
      }

      const cards = playersBar.querySelectorAll('.player-card');
      cards.forEach(card => card.remove());

      if (players) {
        Object.keys(players).forEach(key => {
          const player = players[key];
          const playerCard = document.createElement('div');
          playerCard.className = `player-card ${player.isAlive ? '' : 'dead'}`;
          
          let actionBtnHTML = '';
          if (player.isAlive && isAlive) {
            if (currentPhase === "night") {
              if (myRole === "مافيا" && key !== myPlayerKey) {
                actionBtnHTML = `<button class="action-btn-sm" onclick="handleAction('${key}')">قتل (${player.votes || 0})</button>`;
              } else if (myRole === "طبيب") {
                actionBtnHTML = `<button class="action-btn-sm doctor" onclick="handleAction('${key}')">حماية</button>`;
              } else if (myRole === "محقق" && key !== myPlayerKey) {
                actionBtnHTML = `<button class="action-btn-sm detective" onclick="handleAction('${key}')">كشف</button>`;
              }
            } else if (currentPhase === "voting" && key !== myPlayerKey) {
              actionBtnHTML = `<button class="action-btn-sm" onclick="handleAction('${key}')">تصويت (${player.votes || 0})</button>`;
            }
          }

          playerCard.innerHTML = `<span>${player.name}</span> ${actionBtnHTML}`;
          playersBar.appendChild(playerCard);
        });
      }
    });

    // تفاعل الأزرار حسَب الدور والمرحلة
    window.handleAction = function(targetKey) {
      if (!isAlive) return;

      if (currentPhase === "night") {
        if (myRole === "مافيا") {
          roomRef.child(`players/${targetKey}/votes`).transaction(v => (v || 0) + 1);
        } else if (myRole === "طبيب") {
          roomRef.child('nightActions/healed').set(targetKey);
          alert("اخترت حماية هذا اللاعب!");
        } else if (myRole === "محقق") {
          roomRef.child(`players/${targetKey}`).once('value', (snap) => {
            const role = snap.val().role;
            alert(role === "مافيا" ? "🔍 هذا الشخص مافيا!" : "🔍 هذا الشخص بريء!");
          });
        }
      } else if (currentPhase === "voting") {
        roomRef.child(`players/${targetKey}/votes`).transaction(v => (v || 0) + 1);
      }
    };

    // العداد وحساب انتهاء المراحل
    setInterval(() => {
      roomRef.child('timer').transaction((t) => (t > 0 ? t - 1 : t), (err, committed, snap) => {
        if (committed && snap.val() === 0) {
          handlePhaseTimeout();
        }
      });
    }, 1000);

    function handlePhaseTimeout() {
      if (currentPhase === "night") {
        resolveNightActions();
      } else if (currentPhase === "day") {
        startPhase("voting", 20, "🗳️ حان وقت التصويت النهائي لحظر المتهم!");
      } else if (currentPhase === "voting") {
        resolveVoting();
      }
    }

    function resolveNightActions() {
      roomRef.once('value', (snapshot) => {
        const data = snapshot.val();
        const players = data ? data.players : null;
        const healedKey = data && data.nightActions ? data.nightActions.healed : null;

        if (!players) return;

        let maxVotes = 0;
        let victimKey = null;

        Object.keys(players).forEach(key => {
          if (players[key].isAlive && players[key].votes > maxVotes) {
            maxVotes = players[key].votes;
            victimKey = key;
          }
        });

        if (victimKey && victimKey !== healedKey) {
          roomRef.child(`players/${victimKey}`).update({ isAlive: false });
          startPhase("day", 45, `☀️ أشرقت الشمس! تم القضاء على: ${players[victimKey].name}`);
        } else if (victimKey && victimKey === healedKey) {
          startPhase("day", 45, "☀️ أشرقت الشمس! حاول المافيا القتل ولكن الطبيب أنقذ الضحية!");
        } else {
          startPhase("day", 45, "☀️ أشرقت الشمس! لم يمت أحد الليلة.");
        }
      });
    }

    function resolveVoting() {
      roomRef.child('players').once('value', (snapshot) => {
        const players = snapshot.val();
        if (!players) return;

        let maxVotes = 0;
        let victimKey = null;

        Object.keys(players).forEach(key => {
          if (players[key].isAlive && players[key].votes > maxVotes) {
            maxVotes = players[key].votes;
            victimKey = key;
          }
        });

        if (victimKey) {
          roomRef.child(`players/${victimKey}`).update({ isAlive: false });
          startPhase("night", 30, `🗳️ تم إعدام: ${players[victimKey].name}. حلّ الليل مجدداً...`);
        } else {
          startPhase("night", 30, "🗳️ لم يتم التوصل لقرار. حلّ الليل مجدداً...");
        }
      });
    }
  </script>
</body>
</html>
